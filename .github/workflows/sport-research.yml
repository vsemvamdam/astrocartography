# Research runs for the "Спорт" tab, started by a push to the sport-research branch that changes research/JOB.
# research/JOB lists the jobs: probe (what ESPN gives for other sports), ligue1 (past seasons of Ligue 1 into the
# football base), sports (Frawley's event chart over past seasons of other sports). Results go to results/ in this branch.
name: Sport research

on:
  push:
    branches: [sport-research]
    paths: ['research/JOB']

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      job: ${{ steps.r.outputs.job }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: research }
      - id: r
        run: echo "job=$(cat research/JOB | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    if: contains(needs.plan.outputs.job, 'probe')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: node research/probe_nhl.js results/probe-nhl
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results && git commit -q -m "Probe of ESPN for other sports"
          for i in 1 2 3 4 5; do git pull -q --rebase origin sport-research && git push -q origin HEAD:sport-research && exit 0; sleep $((i * 10)); done; exit 1

  ligue1:
    needs: plan
    if: contains(needs.plan.outputs.job, 'ligue1')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { path: site }
      - run: npm i -s --no-save --prefix "$RUNNER_TEMP/n" astronomy-engine@2.1.19
      - uses: actions/cache@v4
        with:
          path: geonames
          key: geonames-cities500-v1
      - name: GeoNames
        run: |
          if [ ! -s geonames/cities500.txt ]; then
            mkdir -p geonames
            curl -fsSL --retry 3 -o geonames/c.zip https://download.geonames.org/export/dump/cities500.zip
            unzip -oq geonames/c.zip cities500.txt -d geonames && rm geonames/c.zip
            curl -fsSL --retry 3 -o geonames/countryInfo.txt https://download.geonames.org/export/dump/countryInfo.txt
          fi
      - name: Past seasons of Ligue 1
        env:
          ASTRONOMY_JS: ${{ runner.temp }}/n/node_modules/astronomy-engine
        run: |
          git clone -q --depth 1 --branch football-db "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" db
          for y in $(seq 2015 2026); do
            to=$((y + 1))06; [ "$y" = 2026 ] && to=202611
            node site/tools/sport_db.js db --geonames geonames --months "${y}07-${to}" --leagues fra.1 || echo "::warning::season $y did not finish"
          done
      - name: Into the base
        env:
          ASTRONOMY_JS: ${{ runner.temp }}/n/node_modules/astronomy-engine
        run: |
          for i in 1 2 3 4 5; do
            rm -rf latest
            git clone -q --depth 1 --branch football-db "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" latest
            git -C latest config user.name "github-actions[bot]"
            git -C latest config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            node site/research/merge_db.js db latest fra.1
            # summary, table and the rule reports over the joined base
            node site/tools/sport_db.js latest --rejudge
            node site/tools/sport_rules.js latest || echo "::warning::rules report failed"
            node site/tools/sport_ideas.js latest || echo "::warning::ideas report failed"
            cp site/tools/football-db-README.md latest/README.md
            git -C latest add -A
            git -C latest commit -q -m "Ligue 1: seasons 2015/16 to 2026/27"
            git -C latest push -q origin football-db && exit 0
            sleep $((i * 20))
          done
          exit 1

  mirror:
    needs: plan
    if: contains(needs.plan.outputs.job, 'mirror')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { path: site, sparse-checkout: tools }
      - name: ESPN copy with Ligue 1 (as sport-mirror.yml does)
        run: |
          git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prev || mkdir -p prev
          node site/tools/sport_mirror.js prev next
          cd next
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sport data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data && exit 0; sleep $((i * 15)); done
          exit 1

  rejudge:
    needs: plan
    if: contains(needs.plan.outputs.job, 'rejudge')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { path: site }
      - run: npm i -s --no-save --prefix "$RUNNER_TEMP/n" astronomy-engine@2.1.19
      - name: Rejudge the football base
        env:
          ASTRONOMY_JS: ${{ runner.temp }}/n/node_modules/astronomy-engine
        run: |
          for i in 1 2 3 4 5; do
            rm -rf db
            git clone -q --depth 1 --branch football-db "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" db
            git -C db config user.name "github-actions[bot]"
            git -C db config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            node site/tools/sport_db.js db --rejudge
            node site/tools/sport_rules.js db || echo "::warning::rules report failed"
            node site/tools/sport_ideas.js db || echo "::warning::ideas report failed"
            cp site/tools/football-db-README.md db/README.md
            git -C db add -A
            git -C db diff --cached --quiet && exit 0
            git -C db commit -q -m "Places of matches without a venue from the home side; rejudge"
            git -C db push -q origin football-db && exit 0
            sleep $((i * 20))
          done
          exit 1

  sports:
    needs: plan
    if: contains(needs.plan.outputs.job, 'sports')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        sport: [nhl, nba, mlb, nfl, tennis]
    steps:
      - uses: actions/checkout@v4
      - run: npm i -s --no-save --prefix "$RUNNER_TEMP/n" astronomy-engine@2.1.19
      - uses: actions/cache@v4
        with:
          path: geonames
          key: geonames-cities500-v1
      - name: GeoNames
        run: |
          if [ ! -s geonames/cities500.txt ]; then
            mkdir -p geonames
            curl -fsSL --retry 3 -o geonames/c.zip https://download.geonames.org/export/dump/cities500.zip
            unzip -oq geonames/c.zip cities500.txt -d geonames && rm geonames/c.zip
            curl -fsSL --retry 3 -o geonames/countryInfo.txt https://download.geonames.org/export/dump/countryInfo.txt
          fi
      - name: Charts
        env:
          ASTRONOMY_JS: ${{ runner.temp }}/n/node_modules/astronomy-engine
        run: node research/sports.js results --sport ${{ matrix.sport }} --geonames geonames
      - name: Save
        run: |
          gzip -9 -f results/${{ matrix.sport }}/games.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/${{ matrix.sport }} && git commit -q -m "Research: ${{ matrix.sport }}"
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin sport-research && git push -q origin HEAD:sport-research && exit 0; sleep $((i * 10)); done; exit 1

  compare:
    needs: [plan, sports, rejudge]
    if: always() && (contains(needs.plan.outputs.job, 'sports') || contains(needs.plan.outputs.job, 'compare'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Table
        run: |
          git pull -q origin sport-research
          git clone -q --depth 1 --branch football-db "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" db
          node research/compare.js results db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/README.md results/compare.json && git commit -q -m "Research: comparison of sports" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin sport-research && git push -q origin HEAD:sport-research && exit 0; sleep $((i * 10)); done; exit 1
