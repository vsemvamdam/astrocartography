# QA runs for the site, started by a push to the qa branch that changes qa/JOB.
# horizons: JPL Horizons reference positions for qa/verify (qa/verify/data/horizons.json).
name: QA

on:
  push:
    branches: [qa]
    paths: ['qa/JOB']

permissions:
  contents: write

jobs:
  horizons:
    if: contains(github.event.head_commit.message, '') && startsWith(github.ref, 'refs/heads/qa')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the job list
        id: j
        run: echo "job=$(cat qa/JOB | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: JPL Horizons
        if: contains(steps.j.outputs.job, 'horizons')
        run: python3 qa/verify/horizons_fetch.py qa/verify/cases.json qa/verify/data/horizons.json
      - name: Save
        if: contains(steps.j.outputs.job, 'horizons')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/verify/data && git commit -q -m "QA: JPL Horizons reference positions"
          for i in 1 2 3 4 5; do git pull -q --rebase origin qa && git push -q origin HEAD:qa && exit 0; sleep $((i * 10)); done; exit 1
