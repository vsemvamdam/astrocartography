# Fetches small-body state vectors from JPL Horizons for tools/build_tables.js and publishes them
# to the `horizons-data` branch. Run by hand (Actions → Horizons states → Run workflow).
name: Horizons states

on:
  workflow_dispatch:
    inputs:
      bodies:
        description: 'state vectors every 5 years: name=number pairs'
        default: ''
        required: false
      grid:
        description: 'positions every 10 days (near-Earth bodies): name=number pairs'
        default: 'Eros=433,Amor=1221'
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
          sparse-checkout: tools
      - name: Fetch from JPL Horizons
        env:
          GRID: ${{ inputs.grid }}
        run: mkdir out && node site/tools/fetch_horizons.js "${{ inputs.bodies }}" out/horizons-new.json
      - name: Publish to the horizons-data branch
        run: |
          cd out
          git init -q -b horizons-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Horizons states $(date -u +%Y-%m-%d)"
          # GitHub sometimes answers a force push with a transient 500: try a few times before giving up
          for i in 1 2 3 4; do
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" horizons-data && exit 0
            sleep $((i * 15))
          done
          exit 1
