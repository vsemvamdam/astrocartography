name: iOS TestFlight

# Builds a release of the iOS app and uploads it to App Store Connect (TestFlight), signed in the cloud
# with an App Store Connect API key. Run it by hand from the Actions tab once these secrets are set:
#   APPLE_TEAM_ID   — Team ID from developer.apple.com → Membership
#   ASC_KEY_ID      — the key's ID, App Store Connect → Users and Access → Integrations → Keys (role Admin)
#   ASC_ISSUER_ID   — Issuer ID from the same page
#   ASC_KEY_P8      — the contents of the downloaded AuthKey_XXXX.p8 file
# The app record (bundle ID io.github.vsemvamdam.astrosky) must exist in App Store Connect first.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets
        run: |
          for v in TEAM KEY_ID ISSUER; do [ -n "${!v}" ] || { echo "::error::secret for $v is not set"; exit 1; }; done

      - name: Tools and project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project ios/AstroSky.xcodeproj -scheme AstroSky -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AstroSky.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive | grep -E "error:|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/AstroSky.xcarchive"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AstroSky.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
