# AstroSky for iOS. The Xcode project is generated from this file:
#   brew install xcodegen && cd ios && xcodegen && open AstroSky.xcodeproj
# The app bundles the site's own engine files from ../js, so the site and the app always compute the same.
name: AstroSky
options:
  bundleIdPrefix: io.github.vsemvamdam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AstroSky:
    type: application
    platform: iOS
    sources:
      - path: AstroSky
      # the site's engine and data, bundled as they are (see AstroEngine.files for the load order)
      - path: ../js/data.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/chiron-data.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/asteroids-data.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/asteroids-extra-data.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/tz-history.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/meanings.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/acg-core.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/natal.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/features.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/horary.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/cycles.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../js/interpret.js
        group: AstroSky/Engine/Site
        buildPhase: resources
      - path: ../assets/fonts/DejaVuSans.ttf
        group: AstroSky/Resources
        buildPhase: resources
      - path: ../assets/fonts/DejaVuSans-Bold.ttf
        group: AstroSky/Resources
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: AstroSky
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIAppFonts: [DejaVuSans.ttf, DejaVuSans-Bold.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: Чтобы взять ваш город для лунара или соляра — там, где вы находитесь.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vsemvamdam.astrosky
        PRODUCT_NAME: AstroSky
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
  AstroSkyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AstroSkyTests
    dependencies:
      - target: AstroSky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vsemvamdam.astrosky.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AstroSky.app/AstroSky
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  AstroSky:
    build:
      targets:
        AstroSky: all
        AstroSkyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: AstroSkyTests
          parallelizable: false
    archive:
      config: Release
